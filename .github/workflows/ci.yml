name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

jobs:
  ml-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pyrosense_ml
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install deps (frozen)
        run: uv sync --frozen

      - name: Artifact verification (Phase 1 DoD)
        run: |
          uv run python data_science/classification/scripts/verify_artifacts.py || \
          uv run python ../../data_science/classification/scripts/verify_artifacts.py
          uv run python data_science/risk_prediction/scripts/verify_artifacts.py || \
          uv run python ../../data_science/risk_prediction/scripts/verify_artifacts.py

      - name: Run ML test suite
        run: uv run pytest tests/ -q

  backend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build
