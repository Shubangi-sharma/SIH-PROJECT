name: Publish Release

on:
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/pyrosense-backend:${{ github.event.release.tag_name }},${{ secrets.DOCKER_USERNAME }}/pyrosense-backend:latest

      - name: Build & Push ML Service
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/pyrosense-ml:${{ github.event.release.tag_name }},${{ secrets.DOCKER_USERNAME }}/pyrosense-ml:latest

      - name: Generate Release Summary
        run: echo "🎉 Release ${{ github.event.release.tag_name }} published successfully!" > release_summary.txt

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-summary
          path: release_summary.txt
