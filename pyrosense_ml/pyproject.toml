[project]
name = "pyrosense-ml"
version = "0.1.0"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "fastapi[standard]>=0.115",
    "geoalchemy2>=0.15",
    "h3>=4.1",
    "httpx>=0.27",
    "joblib>=1.4",
    "numpy>=1.26,<3",
    "pandas>=2.2",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "scikit-learn==1.6.1",
    "sqlalchemy[asyncio]>=2.0.30",
    "tensorflow>=2.16",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
